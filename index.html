<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MONOCHROME" />
    <meta name="description" content="Музыка без цвета: поиск, полные треки и плейлисты по настроению." />
    <title>MONOCHROME — музыка без цвета</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Load webfonts without blocking first paint: a blocked or slow
         fonts.googleapis.com (itself unreachable in some regions) must not
         leave the app on a blank screen until the CSS request times out. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Only a Vite dev server serves the app from /src/… modules. A service
      // worker left over from an earlier build cached those modules and would
      // keep serving stale JavaScript, which breaks playback while the page
      // still renders. In dev, unregister any such worker and drop its caches
      // once, then reload for a clean load. Production builds (APK, /assets/…)
      // are left alone so the offline PWA shell keeps working.
      (function () {
        if (!('serviceWorker' in navigator)) return
        var isDev = Array.prototype.some.call(
          document.querySelectorAll('script[src]'),
          function (s) { return s.getAttribute('src').indexOf('/src/') === 0 },
        )
        if (!isDev) return
        if (sessionStorage.getItem('mono:sw-purged') === '1') return
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          var work = regs.map(function (r) { return r.unregister() })
          if (window.caches) work.push(caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k) }))
          }))
          return Promise.all(work)
        }).then(function () {
          sessionStorage.setItem('mono:sw-purged', '1')
          if (navigator.serviceWorker.controller) location.reload()
        }).catch(function () {})
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
