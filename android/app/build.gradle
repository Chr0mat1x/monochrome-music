plugins {
  id 'com.android.application'
}

android {
  namespace 'com.monochrome.music'
  compileSdk 35

  defaultConfig {
    applicationId 'com.monochrome.music'
    minSdk 24
    targetSdk 35
    versionCode 6
    versionName '1.5'
  }

  buildTypes {
    release {
      minifyEnabled false
      // Signed with the debug key so the APK installs with no extra setup.
      signingConfig signingConfigs.debug
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  // Only for WebViewAssetLoader: it serves the bundled web app over an https
  // origin. A file:// origin breaks the YouTube IFrame player (and the full
  // tracks it provides), so the app must not run from file://.
  implementation 'androidx.webkit:webkit:1.11.0'
}
